# Render blueprint: one click deploys the API with a managed PostgreSQL database.
# Dashboard -> New -> Blueprint -> select this repository.
services:
  - type: web
    name: supplyguard-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: supplyguard-db
          property: connectionString
      - key: ALLOW_SQLITE_FALLBACK
        value: "false"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: ENABLE_DOCS
        value: "true"
      - key: CORS_ORIGINS
        sync: false # set to your Netlify URL, e.g. https://supplyguard.netlify.app

databases:
  - name: supplyguard-db
    plan: free
    databaseName: supplyguard
    user: supplyguard
